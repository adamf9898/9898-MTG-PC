name: Daily Repository Automation

on:
  workflow_dispatch:
  schedule:
    # Daily at 05:20 UTC
    - cron: "20 5 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-repo-automation
  cancel-in-progress: false

jobs:
  automate:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    defaults:
      run:
        working-directory: projects/9898-MTG-Chaos-RPG-2026

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: projects/9898-MTG-Chaos-RPG-2026/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Analyze repository + runtime environment snapshot
        run: |
          mkdir -p reports/generated
          echo "generated_at=$(date -u +%FT%TZ)" > reports/generated/repo-env-snapshot.txt
          echo "runner_os=$RUNNER_OS" >> reports/generated/repo-env-snapshot.txt
          echo "runner_arch=$RUNNER_ARCH" >> reports/generated/repo-env-snapshot.txt
          echo "node_version=$(node -v)" >> reports/generated/repo-env-snapshot.txt
          echo "npm_version=$(npm -v)" >> reports/generated/repo-env-snapshot.txt
          echo "git_branch=$(git rev-parse --abbrev-ref HEAD)" >> reports/generated/repo-env-snapshot.txt
          echo "git_commit=$(git rev-parse HEAD)" >> reports/generated/repo-env-snapshot.txt
          git -C ../.. ls-files > reports/generated/repository-files.txt

      - name: Run daily analysis / iteration / improvement / integration
        run: |
          npm run analyze
          npm run deep-research
          npm run iterate
          npm run improve
          npm run integrate
          npm run automation:apply

      - name: Upload generated reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-repo-automation-reports
          path: |
            projects/9898-MTG-Chaos-RPG-2026/reports/generated/**
            projects/9898-MTG-Chaos-RPG-2026/docs/reports/**
          if-no-files-found: warn

      - name: Create pull request for improvements
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/daily-repo-iteration
          delete-branch: false
          commit-message: |
            chore: daily repository automation updates
            
            Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>
          title: "chore: daily repository automation updates"
          body: |
            Automated daily repository analysis + iteration + improvement + integration run.
            
            Pipeline executed:
            - npm run analyze
            - npm run deep-research
            - npm run iterate
            - npm run improve
            - npm run integrate
            - npm run automation:apply
