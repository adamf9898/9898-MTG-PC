name: Agent CI

on:
  push:
    paths:
      - '.github/agents/**'
      - '.github/skills/**'
      - '.github/instructions/**'
      - '.github/prompts/**'
      - '.github/todos/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Lint Markdown
        uses: avto-dev/markdown-lint@v1
        with:
          config: '.markdownlint.json'
